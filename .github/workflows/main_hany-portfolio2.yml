name: Build and deploy React Vite app to Azure Web App - hany-portfolio2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite website
        run: npm run build

      - name: Upload built website
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download built website
        uses: actions/download-artifact@v4
        with:
          name: website
          path: ./dist

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B9AB7D5547344FED997F2235F38552B4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_28EE98FB04A1411AA21197765A709353 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1365C4D466B0455FB553D3744836C455 }}

      - name: Deploy website to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: hany-portfolio2
          slot-name: Production
          package: ./dist
