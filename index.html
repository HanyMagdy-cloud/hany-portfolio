<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script>
      window.addEventListener('error', function(e) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.backgroundColor = 'rgba(255, 0, 0, 0.95)';
        div.style.color = 'white';
        div.style.padding = '20px';
        div.style.zIndex = '9999999';
        div.style.overflow = 'auto';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '14px';
        div.innerHTML = '<h1>Global Runtime Error</h1><pre>' + e.message + '\n' + (e.error ? e.error.stack : '') + '</pre>';
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.height = '100%';
        div.style.backgroundColor = 'rgba(255, 0, 0, 0.95)';
        div.style.color = 'white';
        div.style.padding = '20px';
        div.style.zIndex = '9999999';
        div.style.overflow = 'auto';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '14px';
        div.innerHTML = '<h1>Unhandled Promise Rejection</h1><pre>' + e.reason + '\n' + (e.reason && e.reason.stack ? e.reason.stack : '') + '</pre>';
        document.body.appendChild(div);
      });
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myportfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
